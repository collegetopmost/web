<div class="popup-container">
    <h2>Compare & Select from 100+</h2>
    <p class="subtitle">Best University for your Top Online Course</p>

    <form>
        <mat-form-field appearance="outline" class="global_textbox">
            <input matInput placeholder="Your Name" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="global_textbox">
            <input matInput type="email" placeholder="Your Email" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="global_textbox">
            <input matInput type="tel" placeholder="Contact No." />
        </mat-form-field>

        <mat-form-field appearance="outline" class="global_textbox">
            <mat-select placeholder="Select Course">
                <mat-option value="mba">MBA</mat-option>
                <mat-option value="bca">BCA</mat-option>
                <mat-option value="bba">BBA</mat-option>
            </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline" class="global_textbox">
            <mat-select placeholder="Select State">
                <mat-option value="delhi">Delhi</mat-option>
                <mat-option value="up">Uttar Pradesh</mat-option>
                <mat-option value="mh">Maharashtra</mat-option>
            </mat-select>
        </mat-form-field>
    </form>

    <div class="submit_btnbox">
        <button class="global_submit_button" mat-raised-button>
            FIND BEST UNIVERSITY
        </button>
    </div>
</div>
