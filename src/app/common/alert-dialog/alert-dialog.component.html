<div class="dialog-container">
  <div class="icon-wrapper">
    <mat-icon color="primary">warning</mat-icon>
  </div>

  <h2 class="title">{{ data.title || 'Alert' }}</h2>

  <p class="message">
    {{ data.message }}
  </p>

  <div class="actions">
    <button mat-flat-button  (click)="close()">
      OK
    </button>
  </div>
</div>
